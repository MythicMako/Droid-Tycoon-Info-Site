<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Droid Tycoon Rebirth Guide</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <div class="container">
        <h1>DROID TYCOON REBIRTH</h1>
        <div class="sub">Complete requirements — cycles after Super Rebirth (Sheet 1 → 2 → 3 → 4 → back to 1)</div>

        <div class="cycle-tabs">
            <button class="cycle-btn" data-cycle="1">🌀 CYCLE 1 (Start)</button>
            <button class="cycle-btn" data-cycle="2">🌀 CYCLE 2</button>
            <button class="cycle-btn" data-cycle="3">🌀 CYCLE 3</button>
            <button class="cycle-btn" data-cycle="4">🌀 CYCLE 4</button>
        </div>

        <div class="legend">
            <span class="legend-label">Color Key:</span>
            <span class="legend-color color-normal">Normal</span>
            <span class="legend-color color-gold">Gold</span>
            <span class="legend-color color-diamond">Diamond</span>
            <span class="legend-color color-rainbow">Rainbow</span>
            <span class="legend-color color-beskar">Beskar</span>
            <span class="legend-color color-galactic">Galactic</span>
            <span style="color:#4ade80;">⬤</span> Common <span style="color:#60a5fa;">⬤</span> Rare <span style="color:#c27eff;">⬤</span> Epic <span style="color:#fb923c;">⬤</span> Legendary <span style="color:#f87171;">⬤</span> Mythic
        </div>

        <div id="rebirth-container" class="two-columns"></div>
        <footer>
            <div>Made by <a href="https://twitter.com/MythicMako" target="_blank" rel="noopener noreferrer">@MythicMako on X</a></div>
            <div class="update-timestamp">Last updated August 4, 2026</div>
        </footer>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
